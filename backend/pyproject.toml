[project]
name = "sos-my-feed-backend"
version = "0.3.0"
license = "MIT"
# Raise the upper bound only once every locked package has wheels for the new Python.
# The Python actually used is pinned in .python-version.
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "packaging>=26.4",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
