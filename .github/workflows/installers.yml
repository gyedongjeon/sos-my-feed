name: Desktop installers

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/installers.yml'
      - '.github/workflows/release.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12.13
      - name: Build and test macOS disk image
        if: runner.os == 'macOS'
        run: |
          python=$(uv python find --managed-python 3.12.13)
          bash desktop/macos/build.sh "$(dirname "$(dirname "$python")")"
          hdiutil verify desktop/release/*.dmg
      - name: Build and test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = uv python find --managed-python 3.12.13
          $version = node -p "require('./frontend/package.json').version"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" "/DPythonDir=$(Split-Path $python)" desktop/windows/setup.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $installer = Get-Item desktop/release/*.exe
          $dest = Join-Path $env:RUNNER_TEMP 'installed reader'
          $setup = Start-Process $installer.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART `"/DIR=$dest`"" -PassThru -Wait
          if ($setup.ExitCode) { exit $setup.ExitCode }
          python desktop/tests/smoke.py "$dest/python/python.exe" "$dest"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: desktop/release/*
          if-no-files-found: error
          overwrite: true
