name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify version
        run: |
          node <<'JS'
          const assert = require('node:assert/strict')
          const {version} = require('./frontend/package.json')
          const lock = require('./frontend/package-lock.json')
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/)
          assert.equal(process.env.TAG, 'v' + version)
          assert.equal(lock.version, version)
          assert.equal(lock.packages[''].version, version)
          JS

      - uses: actions/download-artifact@v4
        with:
          name: reader-frontend
          path: frontend/dist

      - name: Package reader
        run: |
          zip -qr "sos-my-feed-$TAG.zip" backend/server.py backend/feeds.py frontend/dist LICENSE README.md README.ko.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="sos-my-feed-$TAG.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" --verify-tag --title "$TAG" --generate-notes
          fi
